name: Synchroniser et publier

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      INFOMANIAK_HOST: ${{ secrets.INFOMANIAK_HOST }}
      INFOMANIAK_USER: ${{ secrets.INFOMANIAK_USER }}
      INFOMANIAK_PASSWORD: ${{ secrets.INFOMANIAK_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install beautifulsoup4==4.* lxml

      - name: Récupérer les images du site
        run: python scripts/fetch_assets.py

      - name: Récupérer les campagnes envoyées
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python scripts/fetch_campaigns.py

      - name: Enregistrer les nouvelles campagnes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add raw assets
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Synchronisation Mailchimp $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Construire le site
        run: python scripts/build_site.py

      - name: Publier sur la branche gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Construire la version joursdefrancis.fr
        if: env.INFOMANIAK_HOST != ''
        env:
          JDF_BASE: ""
          JDF_SORTIE: _site_infomaniak
          JDF_CIBLE: infomaniak
        run: python scripts/build_site.py

      - name: Envoyer sur l'hébergement Infomaniak
        if: env.INFOMANIAK_HOST != ''
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$INFOMANIAK_USER","$INFOMANIAK_PASSWORD" "sftp://$INFOMANIAK_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --delete --verbose=1 _site_infomaniak .;
            bye"
